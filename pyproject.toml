[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscan-ai"
version = "0.1.0"
description = "AI-assisted brain MRI analysis for tumour detection and Alzheimer's screening"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "NeuroScan AI Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core ML
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",

    # Medical imaging
    "pydicom>=2.4.0",
    "nibabel>=5.1.0",
    "SimpleITK>=2.3.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "aiofiles>=23.2.0",

    # Frontend
    "streamlit>=1.28.0",

    # Reporting
    "fpdf2>=2.7.6",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utilities
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
mlops = [
    "mlflow>=2.8.0",
    "dvc>=3.30.0",
    "wandb>=0.16.0",
]
gpu = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[project.scripts]
neuroscan-train = "scripts.train:main"
neuroscan-api = "src.api.main:run"
neuroscan-generate-data = "scripts.generate_synthetic_data:main"

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "configs*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "ANN", "S", "B", "A", "COM", "C4", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "ERA", "PGH", "PL", "TRY", "FLY", "PERF", "RUF"]
ignore = ["D100", "D104", "ANN101", "ANN102", "ANN401", "S101", "TRY003", "D203", "D213"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

